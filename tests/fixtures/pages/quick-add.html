<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quick add fixture</title>
<style>
  sticky-add-to-cart[data-stuck="false"] .sticky-add-to-cart__bar { visibility: hidden; opacity: 0; }
  .spacer { height: 1600px; }
</style>
<script>
  // A fake Shopify cart: /cart.js answers from window.cart; adds land after a delay, like a slow theme.
  // (Not named add(): inside a form's inline handler that name is the form's name="add" button.)
  window.cart = { item_count: 0, items: [] };
  window.clicked = [];
  const realFetch = window.fetch;
  window.fetch = (path, options) => String(path).endsWith('/cart.js')
    ? Promise.resolve(new Response(JSON.stringify(window.cart), { headers: { 'Content-Type': 'application/json' } }))
    : realFetch(path, options);
  const addLine = (title, plan) => setTimeout(() => {
    window.cart.items.unshift({ product_title: title, quantity: 1, selling_plan_allocation: plan });
    window.cart.item_count += 1;
  }, 700);
</script>
</head>
<body>
<div class="shopify-section" id="shopify-section-header"><header><a href="/cart">Cart</a></header></div>
<main>
  <!-- Ona's theme: a "Quick add to cart bar", hidden until the main button scrolls away, before the real form -->
  <sticky-add-to-cart data-stuck="false" aria-label="Quick add to cart bar">
    <div class="sticky-add-to-cart__bar">
      <button class="sticky-add-to-cart__button" type="button" id="sticky"
              onclick="window.clicked.push('sticky')">Add to cart</button>
    </div>
  </sticky-add-to-cart>
  <div class="shopify-section" id="shopify-section-main-product">
    <h1>Maple</h1>
    <p>$22.00</p>
    <div class="subscribe-block">
      <form action="/cart/add" onsubmit="event.preventDefault(); window.clicked.push('subscribe'); addLine('Maple', { selling_plan: { name: 'Every 2 weeks' } });">
        <button class="subscribe-block__submit" type="submit" name="add">Subscribe</button>
      </form>
    </div>
    <product-form-component>
      <form action="/cart/add" id="product-form"
            onsubmit="event.preventDefault(); window.clicked.push('main'); addLine('Maple', null);">
        <button type="submit" name="add" data-testid="standalone-add-to-cart"
                id="BuyButtons-ProductSubmitButton-main__add-to-cart">Add to cart</button>
        <div class="shopify-payment-button"><button type="button" onclick="window.clicked.push('buy-now')">Buy it now</button></div>
      </form>
    </product-form-component>
  </div>
  <div class="spacer"></div>
  <div class="shopify-section" id="shopify-section-featured">
    <h2>Aspen</h2>
    <product-form-component>
      <form action="/cart/add" onsubmit="event.preventDefault(); window.clicked.push('other-section'); addLine('Aspen', null);">
        <button type="submit" name="add" data-testid="standalone-add-to-cart">Add to cart</button>
      </form>
    </product-form-component>
  </div>
</main>
</body>
</html>
