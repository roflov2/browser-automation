<!doctype html>
<html><head><meta charset="utf-8"><title>Uber store</title></head>
<body>
<!-- An Uber Eats store page as the item and cart steps meet it: the delivery address in the header, a long
     menu of cards (title, price and a '+' quick-add button each), the item modal over the menu, and the cart
     drawer. ?upsell=1 also opens an upsell popup beside the drawer. ?closed=1 is the same store before it
     opens: the header says so and the item modal offers 'Schedule order' instead of 'Add to order'.
     ?other=1 is a cart left from another store: the header shows 1 item, and 'Add to order' asks
     'Create new order?' before the item replaces that cart.
     ?menuhours= shows the menu's hours in the sidebar, set from the browser's clock: 'later' (opens in two
     hours), 'now' (covers now), 'both' (a later range and one covering now) or 'overnight' (runs past midnight
     and covers now). A menu section far down the page always shows hours that have not started.
     ?quickview=1 opens the item as Uber does now: the URL gains ?mod=quickView and the popup is a plain box
     with no dialog role, whose only labelled button is a disabled 'Schedule order'. -->
<header>
  <a href="/au">Uber Eats</a>
  <button data-testid="edit-delivery-location-button" style="width:220px;height:40px">1 Jeffcott Pl • Now</button>
  <button id="cart" data-testid="view-carts-btn" style="width:80px;height:40px">Cart</button>
</header>
<main>
  <h1>OOSHMAN - Belconnen</h1>
  <p id="hours" style="width:300px;height:20px">4.6 (200+) • Pizza</p>
  <div id="store-desktop-vertical-menu-nav" style="position:absolute;left:0;top:120px;width:180px">
    <button style="width:180px;height:40px"><div>Hackett Uber Menu</div><p id="menuhours"></p></button>
  </div>
  <ul id="menu"></ul>
</main>
<script>
const params = new URLSearchParams(location.search);
if (params.get('closed')) document.getElementById('hours').textContent = 'Closed • Available at 11:00 AM';
const clock = m => { m = ((m % 1440) + 1440) % 1440; const h = Math.floor(m / 60) % 12 || 12;
  return `${h}:${String(m % 60).padStart(2, '0')} ${m < 720 ? 'am' : 'pm'}`; };
const range = (from, to) => `${clock(from)} – ${clock(to)}`;
const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
document.getElementById('menuhours').textContent = {
  later: range(nowMin + 120, nowMin + 180), now: range(nowMin - 60, nowMin + 60),
  both: range(nowMin + 120, nowMin + 180) + ', ' + range(nowMin - 60, nowMin + 60),
  overnight: range(nowMin - 60, nowMin - 120),
}[params.get('menuhours')] || '';
window.cartCount = params.get('other') ? 1 : 0;
const cartBadge = () => { document.getElementById('cart').textContent = window.cartCount ? window.cartCount + ' item' : 'Cart'; };
cartBadge();
window.quickAdds = 0;
const menu = document.getElementById('menu');
const names = ['Super Supreme', 'Garlic Bread', 'Margherita', 'Breakfast roll (available from 7am)'];
for (let i = 0; i < 60; i++) names.push(`Filler dish number ${i} with a long description of its toppings`);
names.forEach((name, i) => {
  const li = document.createElement('li');
  li.style.cssText = 'height:80px';
  li.innerHTML = `<div role="button" class="card" style="width:400px;height:70px"><h3>${name}</h3>` +
    `<span>$${(10 + i).toFixed(2)}</span><p>Tasty ${name.toLowerCase()} made fresh daily.</p></div>` +
    `<button class="plus" aria-label="Quick add" style="width:30px;height:30px">+</button>`;
  li.querySelector('.card').onclick = () => openModal(name, 10 + i);
  li.querySelector('.plus').onclick = () => { window.quickAdds++; };
  menu.append(li);
});
if (params.get('menuhours')) {  // a section's own hours, far below the header and outside the sidebar
  const section = document.createElement('section');
  section.innerHTML = `<h2>Late breakfast</h2><p style="width:200px;height:20px">${range(nowMin + 120, nowMin + 180)}</p>`;
  document.querySelector('main').append(section);
}

function dialog(id, html, css) {
  const d = document.createElement('div');
  d.id = id;
  d.setAttribute('role', 'dialog');
  d.style.cssText = 'position:fixed;background:#fff;' + css;
  d.innerHTML = html;
  document.body.append(d);
  return d;
}

function openModal(name, price) {
  window.openedItem = name;
  if (params.get('quickview')) {
    history.replaceState(null, '', location.pathname + location.search + '&mod=quickView&modctx=%7B%22itemUuid%22%7D');
    const box = document.createElement('div');
    box.id = 'modal';
    box.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5)';
    box.innerHTML = '<div style="position:absolute;top:50px;left:200px;width:600px;height:500px;background:#fff">' +
      `<h2>${name}</h2><p>$${price.toFixed(2)}</p><button style="width:300px;height:40px" disabled>Schedule order</button>` +
      '<button aria-label="Close" style="width:30px;height:30px"></button></div>';
    document.body.append(box);
    return;
  }
  dialog('modal', `<h2>${name}</h2><p>Required: Choose a base</p>` +
    `<label><input type="radio" name="base"> Classic</label><label><input type="radio" name="base"> Gluten free +$3.00</label>` +
    (params.get('closed') ? '<button style="width:300px;height:40px">Schedule order</button>'
      : `<button id="add" style="width:300px;height:40px">Add 1 to order • $${price.toFixed(2)}</button>`),
    'top:50px;left:200px;width:600px;height:500px');
  const add = document.getElementById('add');
  if (add) add.onclick = () => {
    const done = () => { document.getElementById('modal').remove(); window.cartCount = 1; cartBadge(); };
    if (!params.get('other')) { window.cartCount++; document.getElementById('modal').remove(); return cartBadge(); }
    const p = dialog('neworder', '<h2>Create new order?</h2><p>Your order contains items from OOSHMAN - Gungahlin. ' +
      'Create a new order to add items from OOSHMAN - Belconnen.</p>' +
      '<button style="width:100px;height:30px">Cancel</button><button style="width:100px;height:30px">New order</button>',
      'top:150px;left:300px;width:400px;height:200px;z-index:9');
    p.querySelectorAll('button')[0].onclick = () => p.remove();
    p.querySelectorAll('button')[1].onclick = () => { p.remove(); done(); };
  };
}

function openDrawer() {
  dialog('drawer', '<h2>Your cart</h2><ul><li>Super Supreme $22.40</li></ul><p>Subtotal $22.40</p>' +
    '<button style="width:200px;height:40px">Go to checkout</button>', 'top:0;right:0;width:400px;height:600px');
  if (params.get('upsell')) {
    dialog('upsell', '<h2>Complete your meal</h2><button style="width:100px;height:30px">Skip</button>',
      'top:100px;left:100px;width:400px;height:300px');
  }
}
document.getElementById('cart').onclick = openDrawer;
</script>
</body></html>
