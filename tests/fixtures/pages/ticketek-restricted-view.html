<!doctype html>
<html><head><meta charset="utf-8"><title>Ticketek basket with a restricted view</title>
<style>
  .box { display: flex; align-items: center; gap: 12px; padding: 16px; margin: 12px 0; border: 1px solid #ccc; }
  .box input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .tick { width: 22px; height: 22px; border: 2px solid #333; }
  input:checked + .tick { background: #333; }
  button { padding: 12px 40px; }
</style></head>
<body>
<script>window.clicks = [];</script>
<a href="#how">How it works</a>
<!-- Like Ticketek's: a styled checkbox whose real input is visually hidden, and the notice text beside it -->
<label class="box" id="view">
  <input type="checkbox" id="ack" onchange="clicks.push('ack:' + this.checked); sync()">
  <span class="tick"></span>
  <span>By continuing, I acknowledge that one or more of my seats has a <b>restricted view</b>.</span>
</label>
<label class="box" id="refund">
  <input type="checkbox" id="protect" onchange="clicks.push('refund')">
  <span class="tick"></span>
  <span>Add refund protection for my restricted view seats ($12.60)</span>
</label>
<button id="go" disabled onclick="clicks.push('go')">Go to checkout</button>
<script>
  const sync = () => { document.getElementById('go').disabled = !document.getElementById('ack').checked; };
</script>
</body></html>
