<!doctype html>
<meta charset="utf-8">
<title>Guard fixture: shop page</title>
<script>
  window.log = [];
  addEventListener('message', e => window.log.push('frame:' + e.data));
</script>
<button id="place" onclick="log.push('place')">Place order</button>
<button id="pay"><span id="pay-inner" onclick="log.push('pay')">Pay $54.20</span></button>
<div id="confirm" role="button" tabindex="0" onclick="log.push('confirm')">Confirm and pay</div>
<a id="trial" href="#trial" onclick="log.push('trial')">Start free trial</a>
<button id="wallet" aria-label="Shop Pay" onclick="log.push('wallet')"><svg width="10" height="10"></svg></button>
<label id="uberone"><input id="uberone-box" type="checkbox" onchange="log.push('uberone')"> Save an extra $4.99 on this order with a free trial of Uber One</label>
<button id="checkout" onclick="log.push('checkout')">Go to checkout</button>
<button id="add" onclick="log.push('add')">Add to cart</button>
<button id="continue" onclick="log.push('continue')">Continue</button>
<button id="onetime" onclick="log.push('onetime')">One-time purchase</button>
<a id="next" href="checkout/index.html">Next</a>
<div id="host"></div>
<form id="newsletter" onsubmit="log.push('form'); return false">
  <input id="email" name="email" placeholder="Email">
  <input id="card" name="cardnumber" autocomplete="cc-number" placeholder="Card number">
  <input id="cvv" name="cvv" placeholder="CVV">
  <input id="expiry" name="exp-date" placeholder="MM / YY">
  <input id="gift" name="reductions" placeholder="Discount code or gift card">
  <button id="search" type="submit">Search</button>
</form>
<form id="orderform" onsubmit="log.push('orderform'); return false">
  <input id="note" name="note">
  <button id="complete" type="submit">Complete booking</button>
</form>
<iframe id="same" src="frame.html" width="300" height="60"></iframe>
<iframe id="cross" width="300" height="60"></iframe>
<script>
  const shadow = document.getElementById('host').attachShadow({ mode: 'open' });
  shadow.innerHTML = '<button id="buy">Buy now</button>';
  shadow.getElementById('buy').onclick = () => log.push('shadow');
  // The same frame from a second origin: 127.0.0.1 <-> localhost on the same port.
  const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  document.getElementById('cross').src = `http://${other}:${location.port}/frame.html`;
</script>
