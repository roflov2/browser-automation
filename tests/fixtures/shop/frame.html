<!doctype html>
<meta charset="utf-8">
<button id="frame-pay" onclick="parent.postMessage('paid@' + location.hostname, '*')">Pay now</button>
<button id="frame-ok" onclick="parent.postMessage('ok@' + location.hostname, '*')">Continue</button>
<script>
  addEventListener('load', () => {
    parent.postMessage('guard=' + Boolean(window.__auditGuard) + '@' + location.hostname, '*');
    document.getElementById('frame-pay').click();
    document.getElementById('frame-ok').click();
  });
</script>
