<!doctype html>
<html><head><meta charset="utf-8"><title>Flight search</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  main { padding: 20px; }
  #picker { position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column; }
  #months { flex: 1; overflow-y: auto; padding: 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(7, 80px); gap: 4px; margin-bottom: 40px; }
  .grid button { height: 56px; }
  .grid button.picked { outline: 3px solid red; }
  footer.sticky { padding: 12px 20px; border-top: 1px solid #ccc; }
</style></head>
<body>
<!-- A stand-in for qantas.com's search form and its travel-dates modal (a portal outside the form, no dialog role):
     a day click only marks the day; Continue writes it into the form and closes the modal. -->
<main>
  <form id="search" onsubmit="return false">
    <button type="button" id="dates" aria-label="Button to select travel dates, currently set to 29 Nov 2026">29 Nov 2026</button>
    <button type="submit">Search flights</button>
  </form>
</main>
<script>
  const MONTHS = ['January', 'February', 'March'];
  const SHORT = ['Jan', 'Feb', 'Mar'];
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let picked = null;
  const fmt = d => `${d.getDate()} ${SHORT[d.getMonth()]} ${d.getFullYear()}`;
  function openPicker() {
    const portal = document.createElement('div');
    portal.id = 'picker';
    let html = '<div><h2>Select travel dates</h2><button type="button" aria-label="Close">✕</button>'
      + '<div id="picked"><span>Depart BNE</span><br><span id="picked-day">Select a date</span></div></div><div id="months">';
    for (let m = 0; m < 3; m++) {
      html += `<h3>${MONTHS[m]} 2027</h3><div class="grid">`;
      const days = new Date(2027, m + 1, 0).getDate();
      for (let d = 1; d <= days; d++) {
        const disabled = m === 0 && d < 10 ? ' disabled' : '';
        html += `<button type="button" data-m="${m}" data-d="${d}"${disabled}><div>${d}</div><div>$${400 + d}</div></button>`;
      }
      html += '</div>';
    }
    html += '</div><footer class="sticky">Price per adult in AUD. <button type="button" id="continue">Continue</button></footer>';
    portal.innerHTML = html;
    document.body.appendChild(portal);
    portal.querySelectorAll('.grid button').forEach(b => b.addEventListener('click', () => {
      portal.querySelectorAll('.picked').forEach(p => p.classList.remove('picked'));
      b.classList.add('picked');
      picked = new Date(2027, Number(b.dataset.m), Number(b.dataset.d));
      document.getElementById('picked-day').textContent = `${DAYS[picked.getDay()]}, ${fmt(picked)}`;
    }));
    document.getElementById('continue').addEventListener('click', () => {
      if (picked) {
        const button = document.getElementById('dates');
        button.textContent = fmt(picked);
        button.setAttribute('aria-label', `Button to select travel dates, currently set to ${fmt(picked)}`);
      }
      setTimeout(() => document.body.removeChild(portal), 300);  // closes after a short animation
    });
  }
  document.getElementById('dates').addEventListener('click', () => setTimeout(openPicker, 300));
</script>
</body></html>
