<!doctype html>
<html><head><meta charset="utf-8"><title>Payment</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  main { padding: 20px 20px 120px; }
  section { border: 1px solid #ccc; margin: 12px 0; padding: 12px; }
  label { display: block; margin: 6px 0; }
  [role="tab"] { display: inline-block; padding: 8px 12px; border: 1px solid #999; cursor: pointer; }
  [role="tab"][aria-selected="true"] { background: #e40000; color: #fff; }
  navigation-ribbon { display: flex; justify-content: space-between; align-items: center; position: sticky;
                      bottom: 0; background: #fff; border-top: 1px solid #ccc; padding: 12px 20px; }
  navigation-ribbon button { padding: 12px 24px; }
  #pay { background: #e40000; color: #fff; }
  /* Skip links moved off screen (not clipped): they measure as visible, as on the live site when focused. */
  .skip-links a { position: absolute; top: -200px; left: 0; display: block; width: 160px; height: 32px; }
  #overlay { position: fixed; inset: 10% 10%; background: #fff; border: 2px solid #333; }
  #overlay iframe { width: 100%; height: 90%; border: 0; }
  .error { color: #c00; }
</style></head>
<body>
<!-- A stand-in for the Qantas Payment page (run of 2026-11-27 10:40): heading, timer, the login and loyalty offers,
     the method list with Card selected, an empty "Pay by card" panel, and the sticky footer's "< Start over", cart
     total and PAY WITH CARD. A skip-links nav after the footer holds hidden "Pay" anchors that go nowhere.
     ?mode= chooses what PAY WITH CARD does: popup (window.open), navigate (location.href), overlay (a dialog with
     the card iframe) or refuse (field errors). ?method=applepay starts with Apple Pay selected, ?prefill=1 puts a
     value in Card number. Any other button changes the heading to what was clicked, so a wrong click shows. -->
<header><nav><a href="#">Flights</a> <button type="button" class="other">LOG IN NOW</button></nav></header>
<main id="main">
  <h1 id="heading">Payment</h1>
  <p>You have 9:52 left to complete</p>
  <section><h2>Qantas Frequent Flyer</h2><button type="button" class="other">Join for free</button>
    <p>Points Plus Pay <input type="range" aria-label="Points Plus Pay"></p></section>
  <section><h2>Voluntary Carbon Program</h2>
    <label><input type="radio" name="carbon"> Offset this trip $14.60</label>
    <label><input type="radio" name="carbon" checked> No thanks, not for this trip</label></section>
  <section><h2>Payment options</h2>
    <ul role="tablist" id="methods" style="list-style: none; padding: 0">
      <li role="tab" aria-selected="true">Card</li>
      <li role="tab" aria-selected="false">Apple Pay</li>
      <li role="tab" aria-selected="false">Qantas Flight Pass</li>
      <li role="tab" aria-selected="false">PayID</li>
      <li role="tab" aria-selected="false">PayPal</li>
      <li role="tab" aria-selected="false">Zip</li>
      <li role="tab" aria-selected="false">BPAY</li>
    </ul>
    <div id="card-panel"><h3>Pay by card</h3>
      <label for="cc-number">Card number</label><input id="cc-number" autocomplete="cc-number">
      <p class="error" id="cc-number-error"></p>
      <label for="cc-name">Name on card</label><input id="cc-name" autocomplete="cc-name">
      <label for="cc-exp">Expiry (MM/YY)</label><input id="cc-exp" autocomplete="cc-exp">
    </div>
    <p><label for="promo">Promo code</label><input id="promo"></p>
    <p>Total due this transaction $529.00</p>
  </section>
</main>
<div id="overlay" role="dialog" aria-label="Card payment" hidden><button type="button" class="other">Close</button></div>
<navigation-ribbon>
  <button type="button" id="start-over" class="other">&lt; Start over</button>
  <span id="cart-total">$529.00 AUD</span>
  <button type="button" id="pay">PAY WITH CARD &gt;</button>
</navigation-ribbon>
<nav class="skip-links" aria-label="Skip links">
  <a href="#main">Pay</a>
  <a href="#main">Pay with card</a>
</nav>
<script>
  const params = new URLSearchParams(location.search);
  const heading = document.getElementById('heading');
  window.payClicks = 0;
  for (const b of document.querySelectorAll('.other')) {
    b.addEventListener('click', () => { heading.textContent = `Clicked ${b.textContent}`; });
  }
  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
  const choose = tab => {
    tabs.forEach(t => t.setAttribute('aria-selected', String(t === tab)));
    document.getElementById('card-panel').hidden = tab.textContent !== 'Card';
  };
  tabs.forEach(t => t.addEventListener('click', () => choose(t)));
  if (params.get('method') === 'applepay') choose(tabs[1]);
  if (params.get('prefill')) document.getElementById('cc-number').value = '4111';
  document.getElementById('pay').addEventListener('click', () => {
    window.payClicks += 1;
    const mode = params.get('mode') || 'popup';
    if (mode === 'popup') window.open('pay-cart.html');
    else if (mode === 'navigate') location.href = 'pay-cart.html';
    else if (mode === 'overlay') {
      const overlay = document.getElementById('overlay');
      overlay.insertAdjacentHTML('beforeend', '<iframe src="pay-cart.html" title="Secure card payment"></iframe>');
      overlay.hidden = false;
    } else if (mode === 'refuse') {
      document.getElementById('cc-number-error').textContent = 'Card number is required';
    }
  });
</script>
</body></html>
