<!doctype html>
<html><head><meta charset="utf-8"><title>Options</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  main { padding: 20px 20px 120px; }
  section { border: 1px solid #ccc; margin: 12px 0; padding: 12px; }
  navigation-ribbon { display: flex; justify-content: space-between; position: sticky; bottom: 0;
                      background: #fff; border-top: 1px solid #ccc; padding: 12px 20px; }
  navigation-ribbon button { padding: 12px 24px; }
  /* Skip links moved off screen (not clipped): they measure as visible, as on the live site when focused. */
  .skip-links a { position: absolute; top: -200px; left: 0; display: block; width: 160px; height: 32px; }
  #warning { color: #c00; }
</style></head>
<body>
<!-- A stand-in for the Qantas Options page: upsells (upgrade, hotel, car hire), the travel insurance question, fare
     conditions, a sticky footer CONTINUE, and a skip-links nav (after the footer in the DOM) whose anchors say
     Continue and Accept but go nowhere. Continue is refused until insurance is answered; any upsell click changes
     the heading to what was clicked, so a wrong click shows. -->
<header><nav><a href="#">Flights</a> <a href="#">Hotels</a> <button type="button" class="upsell">UPDATE SEARCH</button></nav></header>
<main id="main">
  <h1 id="heading">Options</h1>
  <section><h2>Upgrade your flights</h2><button type="button" class="upsell">UPGRADE MY FLIGHTS</button></section>
  <section><h2>Need Travel Insurance?</h2>
    <p>Australian Comprehensive $40 per adult <button type="button" class="upsell">SELECT</button>
       <button type="button" class="upsell">USE CASH</button></p>
    <label><input type="checkbox" id="no-insurance"> No, I don't want travel insurance</label>
    <p id="warning"></p>
  </section>
  <section><h2>Hotels in Perth</h2><button type="button" class="upsell">SELECT HOTEL</button></section>
  <section><h2>Car hire</h2><button type="button" class="upsell">SEARCH VEHICLES</button></section>
  <section><h2>Red e-Deal conditions</h2><p>Fare conditions apply. Changes permitted for a fee.</p></section>
</main>
<navigation-ribbon>
  <button type="button" id="back">&lt; BACK</button>
  <button type="button" id="continue">CONTINUE &gt;</button>
</navigation-ribbon>
<nav class="skip-links" aria-label="Skip links">
  <a href="#main">Continue</a>
  <a href="#main">Accept</a>
</nav>
<script>
  const heading = document.getElementById('heading');
  for (const b of document.querySelectorAll('.upsell')) {
    b.addEventListener('click', () => { heading.textContent = `Clicked ${b.textContent}`; });
  }
  document.getElementById('continue').addEventListener('click', () => {
    if (!document.getElementById('no-insurance').checked) {
      document.getElementById('warning').textContent =
        'You need to make a travel insurance selection before you can proceed';
      return;
    }
    heading.textContent = 'Passenger details';
  });
</script>
</body></html>
