<!doctype html>
<html><head><meta charset="utf-8"><title>Secure card payment</title>
<style> body { font-family: sans-serif; margin: 20px; } label { display: block; margin: 6px 0; } </style></head>
<body>
<!-- A stand-in for the "pay.cart" card window PAY WITH CARD opens: the amount due, a card fee line and empty card
     inputs. Nothing on it is ever typed into or clicked by the workflow. -->
<h1>Secure card payment</h1>
<p>Amount due $529.00 AUD</p>
<p>Card fee 1.2%</p>
<label for="n">Card number</label><input id="n" autocomplete="cc-number">
<label for="e">Expiry (MM/YY)</label><input id="e" autocomplete="cc-exp">
<label for="c">Security code (CVV)</label><input id="c" autocomplete="cc-csc">
<button type="button" id="submit" onclick="document.title = 'SUBMITTED'">Pay $529.00</button>
</body></html>
