[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "checkout-navigator"
version = "0.3.0"
description = "Site-agnostic Stagehand navigator that walks any purchase or booking funnel to the payment wall and stops"
readme = "README.md"
requires-python = ">=3.11"
# Keep requirements.txt and requirements-azure.txt in sync with these.
dependencies = [
    "stagehand==4.4.0",
    "pydantic>=2.12,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff==0.17.5", "mypy==2.4.1", "types-PyYAML"]
# Azure OpenAI with Microsoft Entra ID sign-in (AZURE_OPENAI_* settings, checkout_navigator/engine/azure_llm.py)
azure = ["openai==3.55.1", "azure-identity==1.27.0", "jsonschema==4.26.0"]

[project.scripts]
checkout-navigator = "checkout_navigator.run:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["checkout_navigator*"]

[tool.setuptools.package-data]
checkout_navigator = ["site_hints.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE", "C90", "RUF", "PTH", "DTZ", "T20", "ANN", "PLC", "PLE", "PLW"]
# E501: the long lines are LLM prompts and in-page JavaScript, which read worse when wrapped.
# ANN401: `Any` is the honest type at the Stagehand and page.evaluate boundaries.
# RUF001: the close button "×" is matched on purpose.
ignore = ["E501", "ANN401", "RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"checkout_navigator/run.py" = ["T201"]  # the CLI prints its result

[tool.mypy]
python_version = "3.11"
strict = true
files = ["checkout_navigator", "main.py"]

[[tool.mypy.overrides]]
module = ["jsonschema", "openai", "azure.*"]
ignore_missing_imports = true
